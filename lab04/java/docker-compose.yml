services:
  meowdb:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "6969:6969"
    networks:
      - meownet

  meowclient:
    build:
      context: .
      dockerfile: Dockerfile.client
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
    # networks:
    #   - meownet
    network_mode: host
    privileged: true
    depends_on:
      - meowdb

networks:
  meownet:
    driver: bridge
